name: Deploy the application
on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "2v24.18.0"
      - name: Install dependencies
        run: pnpm install
      - name: Build the application
        run: pnpm run build
